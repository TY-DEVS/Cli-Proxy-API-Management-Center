services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:latest}
    container_name: cli-proxy-api
    ports:
      - "${CLI_PROXY_HOST_PORT:-8317}:${CLI_PROXY_PORT:-8317}"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./docker/backend/config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_DIR:-./docker/backend/auth}:/CLIProxyAPI/auth
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${CLI_PROXY_PORT:-8317}/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  webui:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      cli-proxy-api:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8080}:80"
    environment:
      APP_PORT: ${APP_PORT:-80}
      APP_DEFAULT_API_BASE: ${APP_DEFAULT_API_BASE:-http://localhost:${CLI_PROXY_HOST_PORT:-8317}}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${APP_PORT:-80}/app-config.js"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
