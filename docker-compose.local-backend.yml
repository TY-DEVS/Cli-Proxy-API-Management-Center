services:
  cli-proxy-api:
    build:
      context: ${CLI_PROXY_BUILD_CONTEXT:-../CLIProxyAPI-main}
      dockerfile: Dockerfile
      args:
        VERSION: ${CLI_PROXY_VERSION:-dev}
        COMMIT: ${CLI_PROXY_COMMIT:-none}
        BUILD_DATE: ${CLI_PROXY_BUILD_DATE:-unknown}
    image: ${CLI_PROXY_LOCAL_IMAGE:-cli-proxy-api:local}